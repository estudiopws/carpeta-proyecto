name: Build y despliegue (Cloudflare Pages)

on:
  push:
    branches: [main]
  pull_request:
    # La preview solo tiene sentido al abrir, actualizar o reabrir el PR.
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Comprobación ligera en cada PR: solo compila, no despliega.
  build-check:
    name: Build (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  # Preview de Pages para PRs del propio repositorio.
  # No usa el entorno "prod": ese entorno solo admite la rama main, así que
  # un PR quedaría bloqueado. Los secretos hay que copiarlos al entorno
  # "preview". La rama que se pasa a Pages nunca es main.
  preview:
    name: Preview (PR)
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    # Los permisos del job sustituyen a los del workflow: hay que repetir
    # contents y deployments. pull-requests: write solo está aquí.
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    concurrency:
      group: pages-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    environment:
      name: preview
      url: ${{ steps.preview-url.outputs.primary }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Nombre de rama para la preview
        id: branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          # El alias de Pages pasa a minúsculas y cambia lo que no sea
          # [a-z0-9] por un guion (fix/api → fix-api). Si el resultado
          # supera un label DNS, se recorta y se le añade un hash estable.
          sanitized=$(printf '%s' "$HEAD_REF" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')
          if [ "${#sanitized}" -gt 63 ]; then
            hash=$(printf '%s' "$sanitized" | sha256sum | cut -c1-6)
            sanitized=$(printf '%s' "$sanitized" | cut -c1-56 | sed -E 's/-+$//')
            sanitized="${sanitized}-${hash}"
          fi
          if [ -z "$sanitized" ] || [ "$sanitized" = "main" ]; then
            echo "::error::La rama '${HEAD_REF}' no puede desplegarse como preview (nombre vacío o equivalente a main)."
            exit 1
          fi
          case "$sanitized" in
            *[!a-z0-9-]*)
              echo "::error::Nombre de rama inesperado tras sanitizar: ${sanitized}"
              exit 1
              ;;
          esac
          case "$sanitized" in
            -* | *-)
              echo "::error::El nombre sanitizado no puede empezar ni terminar en guion: ${sanitized}"
              exit 1
              ;;
          esac
          echo "name=${sanitized}" >> "$GITHUB_OUTPUT"

      - name: Comprobar secretos del entorno preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::Falta el secreto CLOUDFLARE_API_TOKEN en el entorno de GitHub 'preview'."
            missing=1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::Falta el secreto CLOUDFLARE_ACCOUNT_ID en el entorno de GitHub 'preview'."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Crea el entorno 'preview' y copia esos dos secretos desde 'prod'. No se ha desplegado nada."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Desplegar preview en Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=carpeta-proyecto --branch=${{ steps.branch.outputs.name }}

      - name: Elegir la URL de preview
        id: preview-url
        env:
          PAGES_ENVIRONMENT: ${{ steps.deploy.outputs.pages-environment }}
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          env_name=$(printf '%s' "${PAGES_ENVIRONMENT}" | tr '[:upper:]' '[:lower:]')
          if [ "$env_name" = "production" ]; then
            echo "::error::El despliegue de la pull request se publicó como production. Se aborta."
            exit 1
          fi
          primary="${ALIAS_URL}"
          if [ -z "$primary" ]; then
            primary="${DEPLOYMENT_URL}"
          fi
          if [ -z "$primary" ]; then
            echo "::error::wrangler-action no devolvió deployment-url ni pages-deployment-alias-url."
            exit 1
          fi
          reject_if_production() {
            url=$1
            if [ -z "$url" ]; then
              return 0
            fi
            trimmed=${url%/}
            if [ "$trimmed" = "https://carpeta-proyecto.pages.dev" ] \
              || [ "$trimmed" = "http://carpeta-proyecto.pages.dev" ] \
              || [ "$trimmed" = "https://carpeta.estudiopws.com" ] \
              || [ "$trimmed" = "http://carpeta.estudiopws.com" ]; then
              echo "::error::La URL '${trimmed}' es de producción. No se publica el comentario."
              exit 1
            fi
          }
          reject_if_production "$primary"
          reject_if_production "${ALIAS_URL}"
          reject_if_production "${DEPLOYMENT_URL}"
          echo "primary=${primary}" >> "$GITHUB_OUTPUT"

      - name: Crear o actualizar el comentario de preview
        uses: actions/github-script@v7
        env:
          PREVIEW_PRIMARY: ${{ steps.preview-url.outputs.primary }}
          PREVIEW_ALIAS: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          PREVIEW_DEPLOYMENT: ${{ steps.deploy.outputs.deployment-url }}
          PREVIEW_SHA: ${{ github.event.pull_request.head.sha }}
          PREVIEW_HEAD_REF: ${{ github.head_ref }}
          PREVIEW_BRANCH: ${{ steps.branch.outputs.name }}
        with:
          script: |
            const marker = "<!-- carpeta-proyecto-preview -->";
            const primary = process.env.PREVIEW_PRIMARY || "";
            const deployment = process.env.PREVIEW_DEPLOYMENT || "";
            const sha = process.env.PREVIEW_SHA || "";
            const headRef = process.env.PREVIEW_HEAD_REF || "";
            const branch = process.env.PREVIEW_BRANCH || "";

            const lines = [
              marker,
              "### Preview de Cloudflare Pages",
              "",
              `**URL:** ${primary}`,
            ];
            if (deployment && deployment !== primary) {
              lines.push(`**Despliegue concreto:** ${deployment}`);
            }
            lines.push(
              `**Commit:** \`${sha}\``,
              `**Rama:** \`${headRef}\` (Pages: \`${branch}\`)`,
              "",
              "La URL en `*.pages.dev` es pública. El sitio lleva `noindex` y Pages añade `X-Robots-Tag: noindex` en las previews. Si hace falta limitar el acceso, se puede proteger con Cloudflare Access.",
            );
            const body = lines.join("\n");

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              (comment.body || "").includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
              core.info(`Comentario de preview actualizado (${existing.id}).`);
            } else {
              const created = await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
              core.info(`Comentario de preview creado (${created.data.id}).`);
            }

  # Despliegue: tras push a main (es decir, al fusionar) o lanzamiento manual.
  deploy:
    name: Build y despliegue
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Los secretos de Cloudflare están en el entorno "prod" del repo.
    environment:
      name: prod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Desplegar dist en Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=carpeta-proyecto --branch=main
